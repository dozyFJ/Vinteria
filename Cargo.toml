[package]
name = "vinteria_daw"
version = "1.0.11"
edition = "2021"
description = "Winteria DAW - a from-scratch DAW (audio engine, synths, sequencer, piano roll, arrangement, mixer)"

[lib]
name = "vinteria_daw"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "VinteriaDaw"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
hound = "3.5"
arc-swap = "1"
crossbeam-channel = "0.5"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop file dialogs and MIDI input.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
midir = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "com.winteria.daw"
build_targets = ["aarch64-linux-android"]
apk_name = "Winteria"
# launcher icon: tools/make_android_icon.py draws it
resources = "android/res"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Winteria"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "sensorPortrait"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|density"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 4
strip = true



[patch.crates-io]
webbrowser = { path = "vendor/webbrowser" }

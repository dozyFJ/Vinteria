[package]
name = "vinteria_daw"
version = "1.0.163"
edition = "2021"
description = "Winteria DAW - a from-scratch DAW (audio engine, synths, sequencer, piano roll, arrangement, mixer)"

[lib]
name = "vinteria_daw"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "VinteriaDaw"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
hound = "3.5"
arc-swap = "1"
crossbeam-channel = "0.5"
cpal = "0.15"
web-time = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop file dialogs and MIDI input.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rfd = "0.15"
midir = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "HtmlAnchorElement", "HtmlCanvasElement", "Storage", "Url", "Window"] }

[package.metadata.android]
package = "com.winteria.daw"
build_targets = ["aarch64-linux-android"]
apk_name = "Winteria"
resources = "android/res"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Winteria"
# the launcher activity is Java (android/java/.../WinteriaActivity.java, packed into classes.dex): without
# hasCode=true Android never loads classes.dex and the app dies at start with ClassNotFoundException
has_code = true
icon = "@drawable/winteria_splash_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
name = "com.winteria.daw.WinteriaActivity"
orientation = "sensorPortrait"
config_changes = "orientation|screenSize|screenLayout|keyboard|keyboardHidden|navigation|smallestScreenSize|density|uiMode|fontScale|layoutDirection|locale"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 4
strip = true



[patch.crates-io]
webbrowser = { path = "vendor/webbrowser" }
# highp texture coordinates in the shaders: fixes broken glyphs on Android GPUs (see vendor/egui_glow/src/shader)
egui_glow = { path = "vendor/egui_glow" }

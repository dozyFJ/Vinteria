name: Android Dev APK

# A test build that installs NEXT TO the real app: package com.winteria.daw.dev, label "Winteria Dev",
# signed with a throw-away key. It has its own OTA channel and does not need the release key.

on:
  push:
    branches: [winteria]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-dev-apk
  cancel-in-progress: true

jobs:
  dev-apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sm=$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          yes | "$sm" --licenses > /dev/null || true
          "$sm" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      # one throw-away Dev key kept in the Actions cache (never in git), so every Dev APK installs over the previous one
      - name: Dev signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.winteria-dev-key
          key: winteria-dev-keystore-v1

      - name: Build dev APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          # separate app: other package id and name, so it never replaces the real Winteria
          sed -i 's/^package = "com.winteria.daw"$/package = "com.winteria.daw.dev"/; s/^label = "Winteria"$/label = "Winteria Dev"/' Cargo.toml
          grep -n '^package = \|^label = ' Cargo.toml
          # one key for every build, so each Dev APK installs over the previous one:
          # the release key from the repo secrets; only without them a throw-away key (then reinstall is needed)
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dev.keystore"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            echo "signing with the release key from the secrets"
          else
            dev_key="$HOME/.winteria-dev-key/dev.keystore"
            if [ ! -f "$dev_key" ]; then
              echo "::warning::no cached Dev key yet, creating one (install this build once over a clean Winteria Dev)"
              mkdir -p "$(dirname "$dev_key")"
              keytool -genkeypair -keystore "$dev_key" -storetype PKCS12 -storepass android -keypass android \
                -alias dev -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Winteria Dev"
            else
              echo "signing with the cached Dev key"
            fi
            cp "$dev_key" "$RUNNER_TEMP/dev.keystore"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          fi
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/dev.keystore"
          export WINTERIA_DEV_REPOSITORY="$GITHUB_REPOSITORY"
          ./tools/build-android.sh --release
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out && cp target/release/apk/Winteria.apk "out/WinteriaDev-$version.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify Dev signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="out/WinteriaDev-$VERSION.apk"
          apksigner="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/34.0.0/apksigner"
          signer=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "${#signer}" -eq 64
          if gh release view dev-ota >/dev/null 2>&1; then
            gh release download dev-ota --pattern latest.json --output "$RUNNER_TEMP/previous-dev.json"
            jq -e --arg signer "$signer" '.signerSha256 == $signer' "$RUNNER_TEMP/previous-dev.json" >/dev/null || {
              echo "::error::Dev signing key changed. Restore the previous key before publishing updates."
              exit 1
            }
          fi
          echo "DEV_SIGNER=$signer" >> "$GITHUB_ENV"

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-v$VERSION"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" out/*.apk --target "$GITHUB_SHA" --prerelease \
            --title "Winteria Dev $VERSION (test build, installs next to Winteria)" \
            --notes "Test build of ${GITHUB_SHA::7}. Separate app (com.winteria.daw.dev); not an update of Winteria."

      - name: Publish Dev update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="out/WinteriaDev-$VERSION.apk"
          aapt="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/34.0.0/aapt"
          code=$("$aapt" dump badging "$apk" | sed -n "s/^package: name='com.winteria.daw.dev' versionCode='\([0-9]*\)'.*/\1/p")
          test -n "$code"
          if [ -f "$RUNNER_TEMP/previous-dev.json" ]; then
            previous=$(jq -r .versionCode "$RUNNER_TEMP/previous-dev.json")
            if [ "$code" -lt "$previous" ]; then
              echo "A newer Dev update is already published."
              exit 0
            fi
          fi
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/dev-v$VERSION/WinteriaDev-$VERSION.apk"
          jq -n --argjson versionCode "$code" --arg versionName "$VERSION" --arg url "$url" \
            --arg sha256 "$sha" --arg signerSha256 "$DEV_SIGNER" --arg sourceCommit "$GITHUB_SHA" \
            '$ARGS.named' > out/latest.json
          if [ -f "$RUNNER_TEMP/previous-dev.json" ]; then
            gh release upload dev-ota out/latest.json --clobber
          else
            gh release create dev-ota out/latest.json --target "$GITHUB_SHA" --prerelease \
              --title "Winteria Dev update channel" --notes "Manifest used by Winteria Dev."
          fi

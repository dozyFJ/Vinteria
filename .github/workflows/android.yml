name: Android APK

on:
  push:
    branches: [winteria]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.3.11579264
      RELEASE_CERT_SHA256: f8dd8eaed875b0aa5896e1d23cbec407fd7b4e38da634e866ca139a408d18523
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: |
          # the runner image already has the SDK; add the platform, build tools and NDK this build needs
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sm=$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          yes | "$sm" --licenses > /dev/null || true
          "$sm" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          : "${KEYSTORE_B64:?Configure the existing Winteria release keystore}"
          : "${KEYSTORE_PASSWORD:?Configure the password for the release keystore}"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          ./tools/build-android.sh --release
          signer=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs target/release/apk/Winteria.apk)
          digest=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$signer")
          if [ "$digest" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::APK signature is incompatible with the Winteria OTA channel."
            exit 1
          fi
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out && cp target/release/apk/Winteria.apk "out/Winteria-$version.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Winteria-apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v$VERSION"
          gh release create "$tag" out/*.apk --target "$GITHUB_SHA" --prerelease \
            --title "Winteria $VERSION (Android)" --notes "Build of ${GITHUB_SHA::7}."
